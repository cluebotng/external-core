name: CI
on: { pull_request: { } }
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  setup-build:
    uses: infrabits/ci-setup-tox-env/.github/workflows/setup.yml@d891f9fae4be88c3a5d87a662b935b4f1c8d8a19 # main

  execute-lint:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@a574a8250345b3ea42f265ddff4c933924ee71c3 # main
    with:
      environments: ${{ needs.setup-build.outputs.lint }}

  build-container:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build container
        uses: infrabits/ci-pack@a509b1eb75984d9b4712498e98d937584dfffbd3 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/${{ github.repository }}:${{ github.sha }}
          use_builder: latest

  test-container:
    runs-on: ubuntu-latest
    needs: [build-container]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start container
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker run -d -p 3565:3565 ghcr.io/${{ github.repository }}:${{ github.sha }} ./cluebotng -l -m live_run
          timeout 30 bash -c 'until nc -w 1 127.0.0.1 3565 2>/dev/null | grep -q "<WPEditSet>"; do sleep 1; done'

      - name: Verify a vandalised edit
        run: |
          result=$(nc -q 10 127.0.0.1 3565 < .github/data/bad_edit.xml)
          echo "${result}"
          echo "${result}" | grep -q '<think_vandalism>true</think_vandalism>'

      - name: Verify a clean edit
        run: |
          result=$(nc -q 10 127.0.0.1 3565 < .github/data/good_edit.xml)
          echo "${result}"
          echo "${result}" | grep -q '<think_vandalism>false</think_vandalism>'
